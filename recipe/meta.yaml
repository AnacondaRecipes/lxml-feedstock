{% set name = "lxml" %}
{% set version = "6.1.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/l/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1055241852f2b02068af4a625a5d32c087db193c12251928af2562ecd2239f18
  patches:                            # [win]
    - fix_htmlDefaultSAXHandler.patch # [win]

build:
  number: 0

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    # pkg-config is needed to locate %PREFIX%\Library\include\libxml2 on Windows.
    - pkg-config  # [win]
  host:
    - python
    - cython >=3.2.4
    - libxml2 {{ libxml2 }}
    - libxslt {{ libxslt }}
    - pip
    - setuptools
    - wheel
    - libiconv {{ libiconv }} # [win]
    - zlib {{ zlib }}         # [win]
  run:
    - python
    - libxml2 # has run exports
    - libxslt # has run exports

test:
  imports:
    - lxml
    - lxml.etree
    - lxml.objectify
    - lxml.builder
    - lxml.ElementInclude
    - lxml.doctestcompare
    - lxml.includes
    - lxml.html
    - lxml.isoschematron
  requires:
    - pip
  commands:
    - pip check
    - python -c "import lxml, lxml.etree; print(lxml.__version__, lxml.etree.LIBXML_VERSION, lxml.etree.LIBXSLT_VERSION)"
    - python -c "from lxml import etree; print(etree.tostring(etree.fromstring(b'<a><b>1</b></a>')))"
    # Upstream's test suite is not installed (setup.py packages only lxml, lxml.includes,
    # lxml.html, lxml.isoschematron), so `pytest -vv` cannot run it from the built package;
    # the check below exercises the libxml2 parse and libxslt transform bindings instead.
    - python -c "from lxml import etree; x=etree.XML('<a><b>7</b></a>'); s=etree.XML('<xsl:stylesheet version=\'1.0\' xmlns:xsl=\'http://www.w3.org/1999/XSL/Transform\'><xsl:template match=\'/\'><o><xsl:value-of select=\'//b\'/></o></xsl:template></xsl:stylesheet>'); print(etree.tostring(x.xslt(s)))"

about:
  home: https://lxml.de
  license: BSD-3-Clause and GPL-2.0-only and ZPL-2.0 and LicenseRef-ElementTree
  license_family: Other
  license_file: LICENSES.txt
  summary: Pythonic binding for the C libraries libxml2 and libxslt.
  description: |
    The lxml XML toolkit is a Pythonic binding for the C libraries libxml2 and
    libxslt. It is unique in that it combines the speed and XML feature
    completeness of these libraries with the simplicity of a native Python API,
    mostly compatible but superior to the well-known ElementTree API.
  doc_url: https://lxml.de/index.html#documentation
  dev_url: https://github.com/lxml/lxml

extra:
  recipe-maintainers:
    - jjhelmus
    - ocefpaf
